# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Explicitly enable Java toolchain auto-detection/auto-download (both default to true,
# but are stated here in case a machine-wide ~/.gradle/gradle.properties overrides them).
# Combined with the toolchain block in build.gradle and the foojay resolver in
# settings.gradle, this lets Gradle find or download a JDK 25 for compilation even if
# Gradle itself is launched from an older JDK (e.g. by an IDE's Java extension).
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.4.0
mod_id=minetuner
maven_group=bottled.minetuner
archives_base_name=minetuner

# Dependencies
fabric_api_version=0.156.0+26.2

# Config screen dependency — https://shedaniel.gitbook.io/cloth-config
# Version picked to match minecraft_version=26.2 above; see
# https://linkie.shedaniel.me/dependencies (or Modrinth/CurseForge) when
# bumping minecraft_version so this stays in lockstep.
cloth_config_version=26.2.155

# ModMenu — optional; only used to register bottled.minetuner.config.cloth.MineTunerModMenuIntegration
# so the Cloth Config screen is reachable from ModMenu's mod list when the
# player has it installed. Not bundled/shaded — see build.gradle's
# clientCompileOnly declaration (compile-time only, not on the runtime
# classpath at all, so it's never a transitive dependency of the built mod).
modmenu_version=20.0.1
