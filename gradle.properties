# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Explicitly enable Java toolchain auto-detection/auto-download (both default to true,
# but are stated here in case a machine-wide ~/.gradle/gradle.properties overrides them).
# Combined with the toolchain block in build.gradle and the foojay resolver in
# settings.gradle, this lets Gradle find or download a JDK 25 for compilation even if
# Gradle itself is launched from an older JDK (e.g. by an IDE's Java extension).
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=1.1.1
mod_id=mtss
maven_group=bottled.mtss
archives_base_name=mtss

# Dependencies
fabric_api_version=0.156.0+26.2
